  <!-- Popup Container 3  -->
    <div id="popup3" class="popup-overlay3">
        <!--<div class="popup-content3">-->
            <div  class="image-wrapper copy-zone " data-copy="FESTIVE10" style="position: relative;">
              <span style="display:hiddenl;opacity:0" alt="Copy" id="couponCodes" >FESTIVE10</span>
            <img src="./assets/images/popup/exit-popup-ganesha-2025.png" alt="Code Image" width="600">
            <div  title="Click to Copy" onclick="copyCoupons(event)"  class="share_exitPop" style="position: absolute;left: 60%;bottom: 25%;cursor: pointer;">
                <img src="/assets/images/popup/exit-popup-button1.png" alt="Code Image" style="width: 230px;position: absolute;left: 6px;top:-47px">

            </div>
            <div class="shared_close_mid" onclick="closePopup3()" style="position: absolute;top: 3%;right: 15px;cursor: pointer;">
                <img src="./assets/images/popup/exit-popup-button3.png" alt="Code Image">
            </div>

        </div>

 <script>
        let isPopupShown3 = false;

        // Function to check if the device is a mobile
        function isMobileDevice() {
            return window.innerWidth <= 768; // Adjust width as needed for mobile detection
        }

        // Detect when the user is trying to leave (Only for desktops/laptops)
        document.addEventListener("mouseleave", function(event) {
            if (!isPopupShown3 && event.clientY <= 0 && !isMobileDevice()) {
                showPopup();
            }
        });



        function showPopup() {
            document.getElementById("popup3").classList.add("active");
            isPopupShown3 = true;
        }

        function closePopup3() {
            document.getElementById("popup3").classList.remove("active");
        }

        // Copy Coupon Code
        function copyCoupons(event) {
            event.preventDefault(); // Prevent default anchor behavior
            const couponText = document.getElementById("couponCodes");

            if (couponText) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(couponText.innerText)
                        .then(() => showCopiedMessage(event.target))
                        .catch(err => console.error("Failed to copy: ", err));
                } else {
                    // Fallback for older browsers
                    const textArea = document.createElement("textarea");
                    textArea.value = couponText.innerText;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                    showCopiedMessage(event.target);
                }
            } else {
                console.error("Element not found!");
            }
        }

        function showCopiedMessage(targetElement) {
            let message = document.createElement("span");
            message.innerText = "Copied!";
            message.className = "copied-tooltip"; // Add class for styling

            // Position the message relative to the clicked element
            targetElement.parentElement.appendChild(message);

            // Show the tooltip and remove after 1.5 seconds
            setTimeout(() => {
                message.remove();
            }, 1500);
        }

        // Grab Deal Button Click (Show Section & Close Popup)
        document.getElementById("grabDealBtn").addEventListener("click", function(event) {
            event.preventDefault();

            let dealSection = document.getElementById("jump-to-plans");
            let popupOverlay = document.querySelector(".popup-overlay3");

            if (dealSection) {
                dealSection.style.display = "block"; // Show deal section
                dealSection.scrollIntoView({
                    behavior: "smooth"
                }); // Scroll smoothly
                popupOverlay.style.display = "none"; // Hide the popup
            }
        });
    </script>
